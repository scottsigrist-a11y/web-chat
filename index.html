<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Chat</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0 auto;
    max-width: 720px;
    padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  #status {
    font-size: 0.9rem;
    color: #666;
    min-height: 1.5em;
    margin-bottom: 12px;
    white-space: pre-wrap;
  }
  #chat {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 12px;
    min-height: 50vh;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .msg { margin: 0 0 12px; }
  .msg .who { font-weight: 600; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input[type="text"] {
    flex: 1;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { cursor: default; opacity: 0.5; }
</style>
</head>
<body>
<h1>Web Chat</h1>
<div id="status">Starting…</div>
<div id="chat" aria-live="polite"></div>
<form id="form">
  <input id="input" type="text" placeholder="Type a message…" autocomplete="off" disabled />
  <button id="send" type="submit" disabled>Send</button>
</form>

<script type="module">
  // Permanent model for this deployment. Changing it means a new deployment,
  // not a setting: the app intentionally offers no model switcher.
  // NOTE (verify at deploy time): confirm this ID exists in the installed
  // @mlc-ai/web-llm version's prebuilt model list, and pin the package version.
  const MODEL_ID = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
  // q4f16_1 is the smaller build: it needs the shader-f16 WebGPU feature,
  // which Apple GPUs support, and it keeps the download near 400 MB so
  // iPhones (1.5 GB Safari page cap) can actually load it.

  import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

  const statusEl = document.getElementById("status");
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("form");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  const messages = [
    { role: "system", content: "You are a helpful assistant." },
  ];
  let engine = null;
  let generating = false;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function addMessage(who, text) {
    const div = document.createElement("div");
    div.className = "msg";
    const whoEl = document.createElement("span");
    whoEl.className = "who";
    whoEl.textContent = who + ": ";
    div.appendChild(whoEl);
    div.appendChild(document.createTextNode(text));
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function init() {
    if (!navigator.gpu) {
      setStatus(
        "This browser cannot run the model: WebGPU is not available.\n" +
        "Try a recent Chrome or Edge (113+), or Safari 26+."
      );
      return;
    }
    setStatus("Downloading the model (about 400 MB, first visit only — it is cached after that)…");
    try {
      engine = await CreateMLCEngine(MODEL_ID, {
        initProgressCallback: (report) => {
          setStatus(report.text || "Loading the model…");
        },
      });
      setStatus("Ready. Everything runs on your device — nothing you type leaves this browser.");
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    } catch (err) {
      setStatus(
        "Could not load the model: " + (err && err.message ? err.message : err) +
        "\nIf this device is low on memory, try a desktop browser and reload."
      );
    }
  }

  formEl.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = inputEl.value.trim();
    if (!text || !engine || generating) return;
    generating = true;
    inputEl.disabled = true;
    sendEl.disabled = true;
    addMessage("You", text);
    messages.push({ role: "user", content: text });
    inputEl.value = "";
    const replyDiv = addMessage("Assistant", "");
    const replyTextNode = replyDiv.childNodes[1];
    let reply = "";
    try {
      const chunks = await engine.chat.completions.create({
        messages,
        stream: true,
        temperature: 1.0,
        max_tokens: 512,
      });
      for await (const chunk of chunks) {
        const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
        const piece = delta && delta.content ? delta.content : "";
        if (piece) {
          reply += piece;
          replyTextNode.textContent = reply;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
      messages.push({ role: "assistant", content: reply });
    } catch (err) {
      replyTextNode.textContent =
        "Sorry — something went wrong generating a reply: " +
        (err && err.message ? err.message : err);
    } finally {
      generating = false;
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  });

  init();
</script>
</body>
</html>
